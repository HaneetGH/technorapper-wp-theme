name: Agent CLI tests

on:
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/agent-cli-test.yml'
  push:
    branches:
      - main
    paths:
      - 'cli/**'
      - '.github/workflows/agent-cli-test.yml'

permissions:
  contents: read

jobs:
  test:
    name: Node.js CLI tests and package check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CLI tests
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run
