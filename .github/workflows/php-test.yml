name: PHP tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            php -l "$file" || failed=1
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          [[ "$failed" -eq 0 ]] || exit 1

      - name: Run theme tests
        run: php tests/run.php
